services:
  mariadb:
    image: mariadb:10.11
    container_name: goldlogic-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: gouguoa
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --lower_case_table_names=1
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./db_seed_goldlogic.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 12

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: goldlogic-php
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ./gouguoa:/var/www/html

  nginx:
    image: nginx:stable-alpine
    container_name: goldlogic-nginx
    restart: unless-stopped
    depends_on:
      - php
    ports:
      - "8010:80"
    volumes:
      - ./gouguoa:/var/www/html:ro
      - ./docker/nginx/oauth.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  dbdata: